name: Build Linux executable

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "meeting_agent/**"
      - "requirements.txt"
      - "run_meeting_agent.py"
      - "meeting-notes-prompt.md"
      - "svg/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt platform plugin dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build MeetingAgent
        run: |
          pyinstaller --noconfirm --onefile --name MeetingAgent \
            --add-data "meeting-notes-prompt.md:." \
            --add-data "svg:svg" \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all google.genai \
            --collect-all googleapiclient \
            --collect-all google_auth_oauthlib \
            --collect-all reportlab \
            --collect-all xhtml2pdf \
            --collect-all soundcard \
            run_meeting_agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingAgent-linux
          path: dist/MeetingAgent
          if-no-files-found: error
